# Render Blueprint Configuration
# Deploy directly at: https://dashboard.render.com/blueprints

services:
  - type: web
    name: ai-qa-agent-staging
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    branch: staging
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: LLM_PROVIDER
        value: heuristic
      - key: HEADLESS
        value: "true"
      - key: CONFIDENCE_THRESHOLD
        value: "0.70"
