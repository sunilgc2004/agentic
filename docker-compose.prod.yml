version: '3.8'

# Production Environment Compose
# Run with: docker compose -f docker-compose.prod.yml up --build -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-qa-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisSuperSecurePassword123!}
      POSTGRES_DB: ${POSTGRES_DB:-qa_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qa_admin} -d ${POSTGRES_DB:-qa_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-qa-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-qa_admin}:${POSTGRES_PASSWORD:-ChangeThisSuperSecurePassword123!}@postgres:5432/${POSTGRES_DB:-qa_prod}
    volumes:
      - qa_prod_data:/app/backend/data
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    container_name: ai-qa-frontend-prod
    restart: always
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run build && npx serve -s dist -l 5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8000

volumes:
  postgres_prod_data:
  qa_prod_data:
